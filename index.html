<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loja Blox Fruits</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    let cart = JSON.parse(localStorage.getItem('blox_cart')) || [];
    let products = JSON.parse(localStorage.getItem('blox_products')) || [
      { type: 'fruta', name: 'Flame', price: 15 },
      { type: 'permanente', name: 'Dough (Permanente)', price: 60 },
      { type: 'gamepass', name: 'Fruit Notifier', price: 150 }
    ];

    let adminAuthenticated = false;
    const ADMIN_PASSWORD = "admin123";

    function saveProducts() {
      localStorage.setItem('blox_products', JSON.stringify(products));
    }

    function saveCart() {
      localStorage.setItem('blox_cart', JSON.stringify(cart));
    }

    function addToCart(name, price) {
      cart.push({ name, price });
      saveCart();
      updateCart();
    }

    function updateCart() {
      const cartList = document.getElementById('cart-items');
      const totalEl = document.getElementById('cart-total');
      cartList.innerHTML = '';
      let total = 0;

      cart.forEach((item, index) => {
        const li = document.createElement('li');
        li.className = 'flex justify-between';
        li.innerHTML = `${item.name} - R$${item.price} <button onclick="removeFromCart(${index})" class="text-red-600 ml-2">Remover</button>`;
        cartList.appendChild(li);
        total += item.price;
      });

      totalEl.textContent = `Total: R$${total}`;
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      saveCart();
      updateCart();
    }

    function renderProducts() {
      const sections = {
        fruta: document.getElementById('produtos-frutas'),
        permanente: document.getElementById('produtos-permanentes'),
        gamepass: document.getElementById('produtos-gamepasses')
      };
      Object.values(sections).forEach(section => section.innerHTML = '');

      products.forEach(p => {
        const div = document.createElement('div');
        div.className = 'bg-white p-4 rounded-xl shadow';
        div.innerHTML = `
          <h3 class="text-lg font-bold">${p.name}</h3>
          <p class="text-green-600 font-semibold">R$${p.price}</p>
          <button onclick="addToCart('${p.name}', ${p.price})" class="mt-2 bg-blue-600 text-white px-3 py-1 rounded hover:bg-blue-700">Adicionar</button>
        `;
        sections[p.type].appendChild(div);
      });
    }

    function addProduct() {
      const name = document.getElementById('admin-name').value;
      const price = parseFloat(document.getElementById('admin-price').value);
      const type = document.getElementById('admin-type').value;
      if (!name || isNaN(price)) return;
      products.push({ name, price, type });
      saveProducts();
      renderProducts();
    }

    function showAdminPanel() {
      const login = document.getElementById('admin-login');
      const panel = document.getElementById('admin-panel');
      if (adminAuthenticated) {
        login.classList.add('hidden');
        panel.classList.remove('hidden');
      } else {
        login.classList.remove('hidden');
        panel.classList.add('hidden');
      }
    }

    function authenticateAdmin() {
      const password = document.getElementById('admin-password').value;
      if (password === ADMIN_PASSWORD) {
        adminAuthenticated = true;
        showAdminPanel();
      } else {
        alert("Senha incorreta!");
      }
    }

    window.onload = () => {
      renderProducts();
      updateCart();
      adminAuthenticated = false;
      showAdminPanel();
    };
  </script>
</head>
<body class="bg-gray-100 text-gray-900">
  <header class="bg-blue-700 text-white p-4">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-bold">Loja Blox Fruits</h1>
      <nav class="space-x-4">
        <a href="#frutas" class="hover:underline">Frutas</a>
        <a href="#permanentes" class="hover:underline">Permanentes</a>
        <a href="#gamepasses" class="hover:underline">Game Pass</a>
        <a href="#carrinho" class="hover:underline">Carrinho</a>
        <a href="#admin" class="hover:underline">Admin</a>
      </nav>
    </div>
  </header>

  <main class="container mx-auto px-4 py-8">
    <section id="frutas">
      <h2 class="text-xl font-semibold mb-4">Frutas Físicas</h2>
      <div id="produtos-frutas" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
    </section>

    <section id="permanentes" class="mt-12">
      <h2 class="text-xl font-semibold mb-4">Frutas Permanentes</h2>
      <div id="produtos-permanentes" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
    </section>

    <section id="gamepasses" class="mt-12">
      <h2 class="text-xl font-semibold mb-4">Game Passes</h2>
      <div id="produtos-gamepasses" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
    </section>

    <section id="carrinho" class="mt-12">
      <h2 class="text-xl font-semibold mb-4">Carrinho</h2>
      <ul id="cart-items" class="bg-white p-4 rounded shadow space-y-2"></ul>
      <p id="cart-total" class="font-bold mt-2">Total: R$0</p>
      <button class="mt-4 bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Finalizar Compra</button>
    </section>

    <section id="admin" class="mt-12">
      <h2 class="text-xl font-semibold mb-4">Painel Administrativo</h2>

      <div id="admin-login" class="bg-white p-4 rounded shadow max-w-md">
        <input id="admin-password" type="password" placeholder="Senha do admin" class="w-full border p-2 rounded mb-2" />
        <button onclick="authenticateAdmin()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 w-full">Entrar</button>
      </div>

      <div id="admin-panel" class="hidden bg-white p-4 rounded shadow space-y-2 max-w-md">
        <input id="admin-name" type="text" placeholder="Nome do produto" class="w-full border p-2 rounded" />
        <input id="admin-price" type="number" placeholder="Preço" class="w-full border p-2 rounded" />
        <select id="admin-type" class="w-full border p-2 rounded">
          <option value="fruta">Fruta Física</option>
          <option value="permanente">Fruta Permanente</option>
          <option value="gamepass">Game Pass</option>
        </select>
        <button onclick="addProduct()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 w-full">Adicionar Produto</button>
      </div>
    </section>
  </main>

  <footer class="bg-blue-700 text-white text-center p-4 mt-12">
    <p>&copy; 2025 Loja Blox Fruits - Todos os direitos reservados.</p>
  </footer>
</body>
</html>
